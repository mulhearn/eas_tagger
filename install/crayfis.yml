name: crayfis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=2.0           # np.trapezoid (np.trapz is gone in 2.4)
  - scipy
  - matplotlib
  - pandas
  - h5py                 # the shower files (showers/data/*.h5)
  - pyarrow              # Feather output (showers/combine.py)
  - seaborn
  - scikit-learn
  - numba
  - jupyter
  - pip
  - pip:
      - tqdm
